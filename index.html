<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Sênior | Progressão</title>
<style>
:root{--ink:#17232d;--muted:#657481;--line:#dbe3e9;--bg:#f3f6f8;--card:#fff;--hvida:#d96cc9;--amb:#8bd66e;--paz:#4e94d8;--saude:#f3a780}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px/1.35 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{background:#132b40;color:white;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:850;font-size:19px;letter-spacing:-.03em}.subtitle{color:#c7d5df;font-size:12px;margin-top:2px}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:7px 10px;font-weight:750}.light{background:#e7edf2;color:#193348}.gold{background:#f6c75e;color:#33290f}input[type=text]{border:1px solid #cdd7df;border-radius:7px;padding:7px 9px;min-width:160px}
main{max-width:1700px;margin:auto;padding:12px}
.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.summary .count{font-weight:800;color:#193348}.summary input{min-width:190px}.legend{margin-left:auto;color:var(--muted);font-size:11px}.progress{height:6px;width:100px;background:#dce5ea;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}.progress i{height:100%;display:block;background:#29966a;width:0}
.axis{margin:10px 0 15px}.axis-title{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px 9px 0 0;color:#14232e;font-weight:900;text-transform:uppercase;letter-spacing:.035em;font-size:16px}
.axis-title .axis-icon{width:25px;height:25px;display:grid;place-items:center;background:#ffffff9c;border-radius:7px;font-size:17px}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:9px;background:#e7edf1;border-radius:0 0 10px 10px}
.block{background:var(--card);border:1px solid #dbe2e8;border-radius:9px;overflow:hidden;min-width:0;box-shadow:0 2px 5px #1b344508}
.blockhead{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;padding:8px 9px 6px}
.iconbox{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:24px;border:1px solid #0000000a}
.blockname{font-size:14px;font-weight:850;line-height:1.15}.intention{font-size:11px;line-height:1.25;color:#485864;margin-top:4px}
.req{padding:6px 9px;border-top:1px solid #edf1f4}.reqline{display:flex;gap:6px;align-items:flex-start}.reqlabel{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:900;color:#697985;min-width:43px;padding-top:3px}.reqtext{font-size:10px;color:#52616c;line-height:1.25;max-height:31px;overflow:auto;flex:1}
.youthgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:7px 8px 8px;background:#fafcfd;border-top:1px solid #edf1f4}
.youth{border:1px solid #e1e7eb;border-radius:7px;background:#fff;padding:4px;min-width:0}
.youthname{font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.controls{display:grid;grid-template-columns:27px 1fr;gap:4px;align-items:center}
.toggle{width:27px;height:25px;padding:0;border-radius:6px;background:#e8edf1;color:#536572;font-size:12px}
.toggle.yes{background:#d9f2e3;color:#167044}.toggle.no{background:#ffe4e2;color:#a53a35}
.qty{width:100%;min-width:0;height:25px;border:1px solid #d8e0e6;border-radius:6px;padding:2px 4px;text-align:center;background:white}
select.pick{width:100%;min-width:0;height:25px;border:1px solid #d8e0e6;border-radius:6px;padding:2px 3px;background:#fff;margin-top:4px;font-size:10px}
.picklabel{font-size:9px;color:#7a8994;margin-top:4px}
.blockfoot{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;border-top:1px solid #edf1f4;color:#7b8994;font-size:9px}
.hidden{display:none!important}.empty{padding:20px;text-align:center;color:var(--muted)}
@media(min-width:1400px){.blocks{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}.youthgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:12px}.blocks{grid-template-columns:1fr}.youthgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.legend{margin-left:0}}
</style></head>
<body>
<header>
 <div><div class="brand">🧭 Mapa Sênior</div><div class="subtitle">Progressão por bloco · visão coletiva da tropa</div></div>
 <div class="tools"><input id="groupName" type="text" value="Minha Tropa Sênior" aria-label="Nome da tropa"><button class="light" id="export">Exportar CSV</button><button class="gold" id="savecopy">Baixar cópia dos dados</button></div>
</header>
<main>
 <div class="summary">
  <span class="count" id="overall">0/12 jovens · 0 marcações</span>
  <span class="progress"><i id="overallbar"></i></span>
  <input id="search" type="text" placeholder="Filtrar blocos…" aria-label="Filtrar blocos">
  <select id="category" aria-label="Filtrar categoria"><option value="all">Todos os blocos</option><option value="fixed">Com atividade fixa</option><option value="variable">Com variáveis</option><option value="special">Com especialidade/insígnia</option></select>
  <span class="legend">Clique em <b>○</b> para marcar ✓ (concluído), depois × (não) e ○ (pendente). V = quantidade concluída.</span>
 </div>
 <div id="board"></div>
 <div id="empty" class="empty hidden">Nenhum bloco encontrado.</div>
</main>
<script>
const YOUTHS=["ALANA", "AUGUSTO", "ALICE", "CAIO", "DEREK", "GABRIEL", "G. DANIEL", "G. LOPES", "JULIA", "MATHEUS", "RENATA", "TAYLA"];
const BLOCKS=[{"id": 1, "axis": "Habilidades para a vida", "name": "Aprendizagem contínua  e desenvolvimento vocacional", "intention": "Conhecer diferentes temas, planejar estratégias para aprender de maneira eficaz e utilizar novos conceitos e recursos para melhorar seus resultados. Aprofundar seus conhecimentos em áreas de interesse, descobrindo e explorando sua vocação.", "fixed": "* Conquistar, no Ramo Sênior, uma especialidade sobre um tema de seu interesse e que seja um conhecimento novo", "varCount": 3, "varText": "* Explorar diferentes áreas profissionais participando de uma Feira de Profissões ou entrevistando profissionais da área de interesse, investigando os caminhos percorridos, os desafios enfrentados e as motivações que os levaram à escolha da carreira.\n* Engajar-se em atividades voluntárias ou estágios em instituições que despertem interesse, permitindo a vivência prática, o desenvolvimento de habilidades e a compreensão do ambiente profissional e comunitário.\n* Participar de palestras, workshops ou vivências voltadas à orientação vocacional, planejamento de carreira e desenvolvimento pessoal, explorando ferramentas que ajudem na identificação de talentos, interesses e estratégias para o futuro profissional.\n* Organizar uma atividade para a patrulha ou tropa voltada para escolha vocacional.\n* Organizar, para sua tropa ou patrulha, uma oficina, curso ou palestra sobre um tema de seu interesse.\n* Participar de feiras, mostras ou eventos escolares /científicos, fora do Movimento Escoteiro, apresentando trabalhos ou projetos desenvolvidos.", "specialties": ["Comunicações", "Educação", "Empreendedorismo e Negócios", "Finanças e Economia", "Viagens", "Tecnologia", "Liderança e Gestão", "Idiomas", "Gastronomia"], "badges": ["Aprender"], "icon": "🎒"}, {"id": 2, "axis": "Habilidades para a vida", "name": "Autonomia e liderança", "intention": "Assumir responsabilidades dentro de sua patrulha ou equipe de interesse, trabalhando junto aos colegas para alcançar objetivos. Organizar e administrar recursos para seus projetos, definir um orçamento e executar ações para cumpri-lo. Planejar, realizar e avaliar atividades individuais e coletivas, tomando decisões com consciência e responsabilidade.", "fixed": "* Conhecer o material individual e de patrulha necessário para diferentes tipos de excursões (acampamento, acantonamento, volante, fixo) e saber organizá-lo\nna mochila.", "varCount": 4, "varText": "* Participar ativamente do planejamento, da execução e da avaliação de atividades da patrulha, tropa ou equipe de interesse, sendo bem avaliado pelos companheiros e escotistas.\n* Desenvolver o planejamento orçamentário de uma atividade de patrulha, equipe de interesse ou tropa.\n* Utilizar transporte coletivo urbano para uma atividade externa de patrulha.\n* Implementar uma estratégia, incluindo a parte financeira, para alcançar uma meta pessoal, compartilhando sua experiência com sua patrulha.\n* Planejar e executar um projeto de captação de recursos para participação em uma atividade escoteira ou realização de um projeto pessoal.\n* Assumir e desempenhar diferentes encargos na patrulha, sendo bem avaliado pela sua patrulha.\n* Planejar e conduzir um grande jogo para a tropa, com apoio da patrulha ou equipe de interesse.", "specialties": ["Comunicações", "Educação", "Empreendedorismo e Negócios", "Finanças e Economia", "Viagens", "Tecnologia", "Liderança e Gestão", "Idiomas", "Gastronomia"], "badges": [], "icon": "🧭"}, {"id": 3, "axis": "Habilidades para a vida", "name": "Criatividade e inovação", "intention": "Expressar suas ideias, talentos e criatividade por meio da arte, da escrita, da música ou de outras formas de criação. Buscar inovar em seus projetos e iniciativas, explorando novas possibilidades além daquilo que já está acostumado a fazer.", "fixed": "* Durante um acampamento, planejar e executar pioneirias inovadoras de médio ou grande porte.", "varCount": 3, "varText": "* Organizar e conduzir um Fogo de Conselho ou show de talentos para a tropa, UEL ou comunidade.\n* Organizar uma noite cultural para sua patrulha ou tropa.\n*Produzir um curta metragem ou vídeo criativo sobre Escotismo.\n*Organizar uma apresentação artística ou cultural voltada à comunidade.\n*Planejar e realizar mostra sobre um tema de seu interesse, produzindo e curando registros (fotos, vídeos, áudios, textos e objetos) para apresentação à tropa ou comunidade.\n* Participar de concursos culturais, literários ou artísticos locais, representando a tropa.", "specialties": ["Comunicações", "Educação", "Empreendedorismo e Negócios", "Finanças e Economia", "Viagens", "Tecnologia", "Liderança e Gestão", "Idiomas", "Gastronomia"], "badges": ["Inovadores de Impacto"], "icon": "💡"}, {"id": 4, "axis": "Habilidades para a vida", "name": "Inteligência emocional", "intention": "Reconhecer e lidar com seus sentimentos, respeitando suas próprias emoções, expressando-se de forma equilibrada e assertiva.", "fixed": "* Durante as atividades, reconhecer situações que comprometam a integridade física ou emocional, sabendo como agir e a quem recorrer, mantendo-se calmo e em segurança.\n* Praticar feedback construtivo durante as atividades, expressando opiniões de forma assertiva e respeitosa.", "varCount": 4, "varText": "* Identificar as mudanças de emoção repentinas, equilibrando as decisões e reações, buscando agir de maneira respeitosa.\n* Envolver-se em atividades aventureiras com segurança, conhecendo seus limites e enfrentando seus medos.\n* Identificar as situações que causam estresse ou desconforto e as formas e ferramentas de solucioná-las, respeitando seus limites.\n* Negociar responsabilidades familiares e pessoais de forma respeitosa e madura.\n* Conduzir dinâmicas de confiança e cooperação que envolvam lidar com frustrações e celebrar conquistas coletivas.", "specialties": ["Comunicações", "Educação", "Empreendedorismo e Negócios", "Finanças e Economia", "Viagens", "Tecnologia", "Liderança e Gestão", "Idiomas", "Gastronomia"], "badges": [], "icon": "🧠"}, {"id": 5, "axis": "Meio Ambiente", "name": "Consumo responsável", "intention": "Compreender como o consumo responsável influencia o futuro do planeta e adotar hábitos que ajudam a garantir recursos para as próximas gerações.", "fixed": "", "varCount": 4, "varText": "* Liderar a separação de resíduos recicláveis e orgânicos em uma festa da UEL, comunidade ou eventos regionais e nacionais.\n* Visitar uma estação de tratamento de esgoto, aterro sanitário ou cooperativa de reciclagem e discutir as questões ambientais e de consumo.\n* Desenvolver um projeto individual ou coletivo sobre o descarte correto de materiais eletrônicos na UEL, comunidade ou escola.\n* Organizar pelo menos uma oficina, debate ou workshop para a seção sobre um dos seguintes temas: Crueltly-free (produtos livre de exploração\nanimal); Vegetarianismo e Veganismo, Upcycling (Reaproveitamento de itens descartados); Obsolescência Programada e Perceptiva; Microplástico.\n* Em um acampamento, executar uma receita com cascas, talos ou sobras.\n* Organizar um brechó beneficente ou feira de trocas em sua UEL ou comunidade.\n* Participar de visita a cooperativa de reciclagem ou projeto comunitário ligado à economia circular.", "specialties": ["Agricultura Sustentável", "Ecoturismo", "Educação Ambiental", "Esportes de Aventura", "Sustentabilidade", "Natureza e Ciências Naturais", "Habilidades Escoteiras"], "badges": ["Reduzir, Reciclar, Reproduzir", "Tribo da Terra"], "icon": "♻️"}, {"id": 6, "axis": "Meio Ambiente", "name": "Mudanças climáticas", "intention": "Propor e organizar atividades e projetos para reduzir os impactos ambientais e combater as mudanças climáticas. Incentivar práticas sustentáveis no dia a dia e mobilizar outros para agir pelo meio ambiente.", "fixed": "", "varCount": 4, "varText": "* Utilizar ferramentas de acompanhamento meteorológico para o planejamento de atividades ao ar livre.\n* Desenvolver iniciativas ou projetos sobre mudanças climáticas e soluções sustentáveis.\n* Organizar, com sua patrulha, uma atividade ecológica em área urbana, identificando problemas ambientais da localidade e apontando suas causas e possíveis soluções.\n* Participar de clubes ou projetos voltados para sustentabilidade e mudanças climáticas.\n* Utilizar e promover o uso do transporte coletivo, bicicleta ou caminhada em uma atividade escoteira e utilizar um meio de transporte alternativo de fonte de energia renovável.\n* Planejar e executar, em patrulha ou equipe de interesse, um projeto comunitário de reaproveitamento de recursos naturais ou de uso de energias renováveis.", "specialties": ["Agricultura Sustentável", "Ecoturismo", "Educação Ambiental", "Esportes de Aventura", "Sustentabilidade", "Natureza e Ciências Naturais", "Habilidades Escoteiras"], "badges": ["Go Solar", "Tribo da Terra"], "icon": "🌡️"}, {"id": 7, "axis": "Meio Ambiente", "name": "Preservação da biodiversidade", "intention": "Identificar os impactos das ações humanas na biodiversidade e atuar para proteger os ecossistemas, promovendo a preservação da fauna e flora.", "fixed": "* Participar de uma atividade em uma Área de Proteção Ambiental, reconhecendo fauna, flora e bioma local, identificando riscos e propondo soluções para preservação.", "varCount": 2, "varText": "* Participar de eventos sobre preservação da biodiversidade organizados por ONGs, escolas ou parques naturais.\n* Colaborar em um projeto ou ação promovido por alguma ONG ambiental.\n* Coletar e registrar dados sobre espécies locais, qualidade da água ou vegetação.\n* Organizar um projeto individual ou coletivo sobre um dos seguintes temas: abrigos de animais silvestres, enriquecimento ambiental, reintegração de animais ou outra iniciativa de preservação da fauna.\n* Organizar o plantio de árvores nativas em parceria com órgãos ambientais ou ONGs.\n* Conduzir uma campanha de conscientização sobre preservação da fauna e flora em praças, escolas ou redes sociais da comunidade.\n* Promover palestras ou oficinas abertas à comunidade sobre redução de impactos ambientais e proteção da biodiversidade.", "specialties": ["Agricultura Sustentável", "Ecoturismo", "Educação Ambiental", "Esportes de Aventura", "Sustentabilidade", "Natureza e Ciências Naturais", "Habilidades Escoteiras"], "badges": ["Campeões da Natureza", "Tribo da Terra"], "icon": "🌳"}, {"id": 8, "axis": "Meio Ambiente", "name": "Vida ao ar livre", "intention": "Aproveitar ao máximo as atividades ao ar livre e sua conexão com a natureza, sempre cuidando do ambiente e reduzindo seu impacto sobre ele.", "fixed": "\"Montar o campo de patrulha com pioneirias e amarras adequadas; aplicar corretamente os nós direito, correr, lais de guia, volta do fiel, nó em oito, balso pelo seio, catau, volta do salteador e boca de lobo, conhecendo suas funções; escolher, montar, desmontar e acondicionar barracas; manusear com segurança ferramentas de corte e sapa, realizando reparos; preparar diferentes tipos de fogueiras para cozinhar refeições mateiras; planejar e realizar excursões e acampamentos de patrulha com técnicas de baixo impacto; e orientar-se em ambientes naturais utilizando carta, bússola e métodos naturais e tecnológicos de navegação.\"", "varCount": 2, "varText": "* Participar de um acampamento volante.\n* Selecionar corretamente os materiais de campo para um acampamento de patrulha.\n* Em conjunto com a sua patrulha, planejar e construir pelo menos uma das seguintes pioneirias: barraca suspensa, torre de observação ou ponte.\n* Demonstrar conhecimento sobre processos de ancoragem e estiramento de cabos.\n* Utilizar diferentes formas de acondicionamento de alimentos e técnicas de purificação de água em um acampamento.\n* Durante um acampamento de patrulha ou tropa, pernoitar em um abrigo natural.\n* Durante uma atividade aventureira, pernoitar uma noite em bivaque, abrigo natural ou ao relento.\n* Participar de atividades como rafting, canoagem, rapel, espeleologia, escalada, trekking ou mountain bike.\n* Participar de atividades aquáticas de exploração de corpos d'água naturais, respeitando os padrões de segurança.\n* Participar de um acampamento organizado pela patrulha ou tropa de média (3 a 5 dias) ou longa (6 a 10 dias) duração.", "specialties": ["Agricultura Sustentável", "Ecoturismo", "Educação Ambiental", "Esportes de Aventura", "Sustentabilidade", "Natureza e Ciências Naturais", "Habilidades Escoteiras"], "badges": [], "icon": "⛺"}, {"id": 9, "axis": "Paz e Desenvolvimento", "name": "Comunidade", "intention": "Planejar e coordenar projetos que geram impacto positivo na comunidade, dialogando com outras instituições, e promover ações concretas para o bem comum.", "fixed": "* Participar, sozinho, em patrulha ou equipe, de pelo menos 10 horas de ação comunitária com outras instituições locais.\n* Capacitar-se em curso promovido por entidades de referência (defesa civil, cruz vermelha, corpo de bombeiros etc.) e estar preparado para atuar em crises humanitárias.", "varCount": 2, "varText": "* Identificar os riscos de desastres naturais na comunidade, conhecer protocolos de segurança e atuar de acordo com eles.\n* Planejar uma atividade comunitária, como limpeza de praça, visita a uma instituição sem fins lucrativos ou revitalização de uma creche infantil ou lar de repouso de idosos, ou similar.\n* Criar uma biblioteca comunitária móvel com livros doados.\n* Organizar uma campanha de arrecadação (alimentos, roupas, livros) envolvendo diferentes setores da comunidade.\n* Representar a tropa em fóruns, conselhos ou encontros comunitários, contribuindo com ideias e propostas.\n* Promover ações de educação ambiental, saúde ou cidadania em parceria com outras instituições.", "specialties": ["Direitos Humanos", "Ações Humanitárias", "Cultura e Arte", "Desenvolvimento Comunitário", "Ciências Humanas", "Diversidades", "Equidade", "Inclusão e Acessibilidade", "Fé, Crenças e Diálogo Inter-religioso", "Políticas Públicas"], "badges": ["Desafio Comunitário", "Mensageiros da Paz", "Escoteiros do Mundo"], "icon": "👥"}, {"id": 10, "axis": "Paz e Desenvolvimento", "name": "Democracia", "intention": "Participar ativamente da democracia, engajando-se em debates, contribuindo na tomada de decisões e ajudando a construir soluções coletivas para desafios sociais.", "fixed": "Participar ativamente das decisões do Conselho de Patrulha e da Assembleia de Tropa, contribuindo com ideias, votando, assumindo responsabilidades e respeitando os resultados, bem como participar da eleição do monitor e da definição dos encargos da patrulha.", "varCount": 4, "varText": "* Participar de Audiência Pública e consultas populares de temas de seu interesse promovidas pelo poder legislativo.\n* Emitir o título de eleitor, compreendendo a importância dos processos democráticos do país e, em ano eleitoral, pesquisar sobre os candidatos e suas propostas.\n* Planejar e executar uma campanha para educar outros jovens sobre temas como voto consciente e direitos do cidadão.\n* Participar de ao menos uma Assembleia do Grupo Escoteiro.\n* Participar ativamente de um Fórum de Grupo Escoteiro.\n* Participar de grêmio estudantil ou conferências de juventude.\n* Participar de pelo menos uma atividade da seção, como debates, estudos de caso ou “júri simulado”, de forma respeitosa e contributiva.\n* Participar de dinâmicas de mediação de conflitos, praticando a escuta ativa e construção de consensos.", "specialties": ["Direitos Humanos", "Ações Humanitárias", "Cultura e Arte", "Desenvolvimento Comunitário", "Ciências Humanas", "Diversidades", "Equidade", "Inclusão e Acessibilidade", "Fé, Crenças e Diálogo Inter-religioso", "Políticas Públicas"], "badges": [], "icon": "🗳️"}, {"id": 11, "axis": "Paz e Desenvolvimento", "name": "Herança cultural", "intention": "Compartilhar a herança cultural de sua comunidade e do seu país, organizando atividades e projetos que valorizam a história, os costumes e os saberes ancestrais dos povos originários brasileiros.", "fixed": "* Conduzir a cerimônia de abertura de uma atividade de patrulha ou tropa.", "varCount": 5, "varText": "* Organizar com sua patrulha uma expedição que promova o contato com culturas como: Povos originários, Comunidades quilombolas, Comunidades ribeirinhas ou caiçaras; Abordando língua, costumes, festividades e tradições, e debater formas de valorizar e preservar essas culturas.\n* Organizar a recepção de membros do Movimento Escoteiro de outras localidades e apresentá-los aos principais pontos históricos e turísticos de seu município.\n* Fazer tour em sua cidade, explorando pontos históricos e culturais como: Centro cultural, Biblioteca pública, Mercado municipal, Feiras típicas, Museus, Marcos históricos, entre outros.\n* Identificar os núcleos culturais de sua região e participar de atividades com eles (ex.: centro de tradições gaúchas, núcleos israelitas, associações de colônias imigrantes).\n* Apresentar uma forma de expressão artística da cultura popular brasileira em um Fogo de Conselho.\n* Promover um festival com música, poesia, dança e literatura típicas de uma região para seu grupo escoteiro ou comunidade.\n* Produzir, com sua patrulha, uma peça para uso cotidiano, utilizando técnicas de artesanato brasileiro.\n* Apresentar a cultura da sua cidade em um evento regional, nacional ou internacional, como feira das cidades ou noite folclórica.", "specialties": ["Direitos Humanos", "Ações Humanitárias", "Cultura e Arte", "Desenvolvimento Comunitário", "Ciências Humanas", "Diversidades", "Equidade", "Inclusão e Acessibilidade", "Fé, Crenças e Diálogo Inter-religioso", "Políticas Públicas"], "badges": [], "icon": "🏛️"}, {"id": 12, "axis": "Paz e Desenvolvimento", "name": "Promoção da paz", "intention": "Desenvolver projetos que promovem a paz, o respeito à diversidade, o diálogo entre diferentes culturas e crenças, reconhecendo e valorizando a pluralidade da humanidade", "fixed": "* Participar de uma ação colaborativa sobre diferentes temas que envolvem a cultura de paz, hamento de desafios e a busca conjunta por soluções.\n* Assumir responsabilidades no ambiente familiar, contribuindo de forma constante com tarefas do dia a dia e promovendo diálogo respeitoso sobre decisões coletivas.\n* Convidar um colega da mesma faixa etária para participar de um Fogo de Conselho, integrado a sua patrulha e com o devido “Registro de Visitante”.", "specialties": ["Educação Alimentar e Nutricional", "Esportes", "Hobbies e Lazer", "Saúde Mental e Bem-Estar Emocional", "Saúde", "Saúde Sexual e Reprodutiva"], "badges": [], "icon": "🤝"}];
const AXES=[
 {name:"Habilidades para a vida",color:"#d96cc9",pale:"#f9e7f6",icon:"🧠"},
 {name:"Meio Ambiente",color:"#8bd66e",pale:"#edf9e7",icon:"🌱"},
 {name:"Paz e Desenvolvimento",color:"#4e94d8",pale:"#e7f1fc",icon:"🕊️"},
 {name:"Saúde e Bem-Estar",color:"#f3a780",pale:"#fff0e6",icon:"💗"}
];
const KEY="mapa-senior-board-v3";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function cell(y,b){state[y]??={};state[y][b]??={fixed:"pendente",qty:0,specialty:"",badge:""};return state[y][b]}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}updateSummary()}
function badgeOptions(b){return b.badges||[]}
function render(){
 let query=document.getElementById("search").value.toLowerCase(),cat=document.getElementById("category").value;
 let board=document.getElementById("board");board.innerHTML="";
 AXES.forEach((axis,ai)=>{
  let list=BLOCKS.filter(b=>b.axis===axis.name&&b.name.toLowerCase().includes(query));
  list=list.filter(b=>cat==="all"||(cat==="fixed"&&b.fixed)||(cat==="variable"&&b.varCount>0)||(cat==="special"&&(b.specialties.length||b.badges.length)));
  if(!list.length)return;
  let sec=document.createElement("section");sec.className="axis";
  sec.innerHTML=`<div class="axis-title" style="background:${axis.color}"><span class="axis-icon">${axis.icon}</span>${esc(axis.name)} <span style="font-size:11px;font-weight:650;margin-left:auto">${list.length} blocos</span></div><div class="blocks"></div>`;
  let grid=sec.querySelector(".blocks");
  list.forEach(b=>{
   let card=document.createElement("article");card.className="block";
   card.style.borderTop=`3px solid ${axis.color}`;
   let fixed=b.fixed?`<div class="req"><div class="reqline"><span class="reqlabel">Fixa</span><div class="reqtext" title="${esc(b.fixed)}">${esc(b.fixed)}</div></div></div>`:"";
   let vari=b.varCount?`<div class="req"><div class="reqline"><span class="reqlabel">Variáveis</span><div class="reqtext">${b.varCount} a cumprir · ${esc(b.varText||"")}</div></div></div>`:"";
   card.innerHTML=`<div class="blockhead"><div class="iconbox" style="background:${axis.pale}">${esc(b.icon||axis.icon)}</div><div><div class="blockname">${esc(b.name)}</div><div class="intention">${esc(b.intention)}</div></div></div>${fixed}${vari}<div class="youthgrid"></div><div class="blockfoot"><span>F = fixa · V = variáveis</span><span>${b.specialties.length?"Especialidades":""}${b.specialties.length&&b.badges.length?" · ":""}${b.badges.length?"Insígnias":""}</span></div>`;
   let yg=card.querySelector(".youthgrid");
   YOUTHS.forEach(y=>{
    let s=cell(y,b.id),tile=document.createElement("div");tile.className="youth";
    tile.innerHTML=`<div class="youthname" title="${esc(y)}">${esc(y)}</div><div class="controls">${b.fixed?`<button class="toggle ${s.fixed==="sim"?"yes":s.fixed==="nao"?"no":""}" data-field="fixed" title="Status da atividade fixa">${s.fixed==="sim"?"✓":s.fixed==="nao"?"×":"○"}</button>`:`<span class="toggle" style="display:grid;place-items:center;background:#f3f5f6">—</span>`}${b.varCount?`<input class="qty" type="number" min="0" max="${b.varCount}" value="${Number(s.qty)||0}" aria-label="Variáveis concluídas de ${esc(y)}" title="Quantidade de variáveis concluídas (máx. ${b.varCount})">`:`<span class="qty" style="display:grid;place-items:center;border:0;color:#a0abb3">—</span>`}</div>
    ${b.specialties.length?`<div class="picklabel">Especialidade</div><select class="pick" data-field="specialty"><option value="">Selecionar…</option>${b.specialties.map(x=>`<option ${s.specialty===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`:""}
    ${b.badges.length?`<div class="picklabel">Insígnia</div><select class="pick" data-field="badge"><option value="">Selecionar…</option>${b.badges.map(x=>`<option ${s.badge===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`:""}`;
    let t=tile.querySelector('[data-field="fixed"]');if(t)t.addEventListener("click",()=>{let order=["pendente","sim","nao"];s.fixed=order[(order.indexOf(s.fixed)+1)%order.length];save();render()});
    let q=tile.querySelector("input.qty");if(q)q.addEventListener("change",()=>{s.qty=Math.max(0,Math.min(b.varCount,Number(q.value)||0));q.value=s.qty;save()});
    tile.querySelectorAll("select[data-field]").forEach(sel=>sel.addEventListener("change",()=>{s[sel.dataset.field]=sel.value;save()}));
    yg.appendChild(tile)
   });
   grid.appendChild(card)
  });
  board.appendChild(sec)
 });
 document.getElementById("empty").classList.toggle("hidden",board.children.length>0);
 updateSummary()
}
function updateSummary(){
 let marks=0,total=YOUTHS.length*BLOCKS.length;
 YOUTHS.forEach(y=>BLOCKS.forEach(b=>{let s=cell(y,b.id);if(s.fixed==="sim")marks++;marks+=Number(s.qty)||0;if(s.specialty)marks++;if(s.badge)marks++}));
 let complete=YOUTHS.filter(y=>BLOCKS.every(b=>{let s=cell(y,b.id);return (!b.fixed||s.fixed==="sim")&&(!b.varCount||Number(s.qty)>=b.varCount)&&(!b.specialties.length||!!s.specialty)&&(!b.badges.length||!!s.badge)})).length;
 document.getElementById("overall").textContent=`${complete}/${YOUTHS.length} jovens · ${marks} marcações`;
 document.getElementById("overallbar").style.width=(complete/YOUTHS.length*100)+"%";
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("category").addEventListener("change",render);
document.getElementById("groupName").addEventListener("input",()=>{try{localStorage.setItem("mapa-senior-group",document.getElementById("groupName").value)}catch(e){}});
document.getElementById("export").addEventListener("click",()=>{
 let rows=[["Tropa",document.getElementById("groupName").value],["Jovem","Eixo","Bloco","Atividade fixa","Variáveis concluídas","Especialidade","Insígnia"]];
 YOUTHS.forEach(y=>BLOCKS.forEach(b=>{let s=cell(y,b.id);rows.push([y,b.axis,b.name,s.fixed,s.qty,s.specialty,s.badge])}));
 let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="mapa-senior.csv";a.click();URL.revokeObjectURL(a.href)
});
document.getElementById("savecopy").addEventListener("click",()=>{
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({group:document.getElementById("groupName").value,state},null,2)],{type:"application/json"}));a.download="mapa-senior-dados.json";a.click();URL.revokeObjectURL(a.href)
});
let savedGroup=localStorage.getItem("mapa-senior-group");if(savedGroup)document.getElementById("groupName").value=savedGroup;
render();
</script></body></html>
